[package]
name = "dioxus-native-dom"
version = { workspace = true }
authors = ["Jonathan Kelley", "Nico Burns"]
edition = "2021"
description = "Core headless native renderer for Dioxus based on blitz"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react"]

[features]
default = ["accessibility", "svg", "system-fonts"]
svg = ["blitz-dom/svg"]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]
system-fonts = ["blitz-dom/system_fonts"]
autofocus = []

[dependencies]
# Blitz dependencies
blitz-dom = { workspace = true, default-features = false }
blitz-traits = { workspace = true }

# DioxusLabs dependencies: crates.io versions, NOT workspace path deps.
# This package is consumed as a git dependency patching crates.io's
# dioxus-native-dom; path deps would drag a second copy of dioxus-core
# into the consumer's graph next to the crates.io one.
dioxus-core = { version = "0.7.9" }
dioxus-html = { version = "0.7.9" }

# Windowing & Input
keyboard-types = { workspace = true }


# Other dependencies
tracing = { workspace = true, optional = true }
rustc-hash = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
dioxus = { version = "0.7.9" }

[package.metadata.docs.rs]
all-features = true
